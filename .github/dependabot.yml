# Dependabot (ADR 0048): a weekly pull request for the Mix packages and one
# for the actions. A security update comes as soon as GitHub knows of it.
# The message of each commit starts with `chore(deps):`, as Conventional
# Commits asks (ADR 0060).
#
# Not here, and updated by hand:
#   * shoddy and shoddy_phoenix, pinned to a commit on purpose (ADR 0005);
#   * Elixir, Erlang/OTP and Debian: devenv.lock, and the ARG lines of
#     platform/Dockerfile, which Dependabot cannot read. Each image build
#     installs the security fixes of Debian.
version: 2
updates:
  - package-ecosystem: mix
    directory: /platform
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: shoddy
      - dependency-name: shoddy_phoenix
    groups:
      mix:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

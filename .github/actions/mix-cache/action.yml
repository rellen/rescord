# The dependencies and the test build of platform/, as the job "Compile"
# of ci.yml saved them for this commit (ADR 0103). Each job restores the
# same key, so the jobs of one run share one build.
#
# A key names the toolchain (devenv.lock), the locked dependencies
# (platform/mix.lock) and the commit. When the job "Compile" of this
# commit saved nothing, a job takes the newest build of the same lock, and
# then of the same toolchain: mix compiles only what changed since.
name: The cache of mix
description: Restores platform/deps and platform/_build/test.
outputs:
  key:
    description: The key of this commit, for actions/cache/save.
    value: ${{ steps.key.outputs.key }}
  hit:
    description: Whether the build of this very commit was restored.
    value: ${{ steps.restore.outputs.cache-hit == 'true' || steps.retry.outputs.cache-hit == 'true' }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        TOOLCHAIN: ${{ hashFiles('devenv.lock') }}
        LOCK: ${{ hashFiles('platform/mix.lock') }}
      run: |
        prefix="mix-$RUNNER_OS-$TOOLCHAIN"
        {
          echo "toolchain=$prefix-"
          echo "lock=$prefix-$LOCK-"
          echo "key=$prefix-$LOCK-$GITHUB_SHA"
        } >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          platform/deps
          platform/_build/test
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.lock }}
          ${{ steps.key.outputs.toolchain }}

    # The cache answers 429 when the repository asks it too often, and the
    # restore then finds nothing and fails no step. So one more try, after a
    # pause.
    - if: steps.restore.outputs.cache-matched-key == ''
      shell: bash
      run: sleep 20

    - id: retry
      if: steps.restore.outputs.cache-matched-key == ''
      uses: actions/cache/restore@v6
      with:
        path: |
          platform/deps
          platform/_build/test
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.lock }}
          ${{ steps.key.outputs.toolchain }}

    # A checkout gives each file the time of now, which is newer than the
    # build, and mix then compiles the whole app again: 500 files, about 30
    # seconds in each job. With the build of this very commit, the files are
    # the ones that it compiled, so they get the time of the commit, which
    # is older than the build, and mix compiles nothing. Mix still finds a
    # file whose content changed by its digest. After a fallback the files
    # keep the time of now, so mix checks everything, as it would anyway.
    - if: steps.restore.outputs.cache-hit == 'true' || steps.retry.outputs.cache-hit == 'true'
      shell: bash
      run: |
        at=$(git log -1 --format=%ct)
        git ls-files -z | xargs -0 touch -h -d "@$at"

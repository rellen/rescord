# The checks of each push to main and of each pull request (ADR 0047). They
# run inside the devenv shell, so CI has the toolchain of devenv.lock, its
# PostgreSQL 18, and the Playwright of nixpkgs for the browser tests. A push
# also checks the messages of its commits (ADR 0060), and each run scans the
# history for secrets (ADR 0064) and checks that each new migration has its
# upgrade note (ADR 0073). A release runs these checks too, before it
# publishes anything. A push to main cancels the run of the push before it,
# so `ci-catch-up.yml` starts a run that no push cancels when main has
# waited an hour for a result (ADR 0078).
#
# The jobs run side by side (ADR 0103): the quick checks at once; one
# compile that saves its build; then the checks of the code, the tests in
# parts and the browser tests in parts, each from that build; and the flake
# check. The job "CI" at the end gives one result for the run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a branch or of a pull request cancels the older one. In a
# release, `github.workflow` is the name of the workflow Release, so a push
# to main and a release do not cancel each other.
#
# A run that the Actions page, the API or `ci-catch-up.yml` starts on main
# (workflow_dispatch) is kept (ADR 0078): it has a group of its own, so no
# push cancels it, and a second kept run waits for the first to end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '-kept' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  # A job of its own, so a bad message does not hide the result of the tests.
  messages:
    name: The messages of the commits
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history, for the commits of the push and the tag where the
      # rule starts.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check each commit of the push
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/check-commit-message.sh --range "$BEFORE..$GITHUB_SHA"

  # Each migration that is new since the last release has its line in the
  # upgrade notes of CHANGELOG.md, and no migration of that release changed
  # (ADR 0073). A job of its own, so a missing note shows beside the tests.
  notes:
    name: The upgrade notes of the migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history and the tags: the check compares with the last
      # release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show that the check finds a migration with no note
        run: scripts/check-upgrade-notes.sh --self-test
      - name: Check each new migration
        run: scripts/check-upgrade-notes.sh

  # The scan for secrets, and for what belongs to one deployment (ADR 0064).
  # A job of its own, so a finding shows in a minute, beside the tests.
  # Gitleaks is the one of the nixpkgs of flake.lock.
  scan:
    name: The scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history: the scan reads each commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v32

      - name: Show that each rule finds its sample
        run: nix shell --inputs-from . nixpkgs#gitleaks -c scripts/check-secrets.sh --self-test

      # The secret PRIVATE_TERMS of the repository holds the names of the
      # deployments of the maintainer, one on each line. A pull request from
      # a fork has no secret, and the scan then runs with the rules alone.
      - name: Scan each commit
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -n "$PRIVATE_TERMS" ]; then
            printf '%s\n' "$PRIVATE_TERMS" > "$RUNNER_TEMP/private-terms"
            export RESCORD_PRIVATE_TERMS="$RUNNER_TEMP/private-terms"
          fi
          nix shell --inputs-from . nixpkgs#gitleaks -c scripts/check-secrets.sh


  # The workflows, the actions and the scripts of the repository: actionlint
  # (which runs shellcheck on each `run:`), shellcheck on scripts/, the
  # format of the Nix files, and the self-test of the rule of
  # ci-catch-up.yml. The tools are those of the nixpkgs of flake.lock.
  scripts:
    name: The workflows and the scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Check the workflows and the actions
        run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck -c actionlint

      - name: Check the scripts
        run: nix shell --inputs-from . nixpkgs#shellcheck -c shellcheck scripts/*.sh

      - name: Check the format of the Nix files
        run: |
          # shellcheck disable=SC2046
          nix shell --inputs-from . nixpkgs#nixfmt -c nixfmt --check $(git ls-files '*.nix')

      - name: Show that the rule of ci-catch-up.yml decides each case
        run: scripts/ci-catch-up.sh --self-test

  # The one compile of the run (ADR 0103). It saves the dependencies and the
  # test build right after the compile, so that a later failure or a cancel
  # still leaves the build for the next run. Each later job of mix restores
  # this build and compiles nothing.
  compile:
    name: Compile, with no warning
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/devenv

      - id: cache
        uses: ./.github/actions/mix-cache

      - name: Fetch the dependencies
        run: devenv shell -- bash -c 'cd platform && mix deps.get'

      - name: Compile with the test support, with no warning
        run: devenv shell -- bash -c 'cd platform && MIX_ENV=test mix compile --warnings-as-errors'

      - name: Save the dependencies and the build
        if: steps.cache.outputs.hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            platform/deps
            platform/_build/test
          key: ${{ steps.cache.outputs.key }}

  # What needs the build but no database: the format (with its plugins),
  # Credo, the advisories of Hex, the lock, and the migrations that the
  # resources need. Everything runs in the test environment, the one that
  # the job "Compile" built.
  checks:
    name: Format, Credo and the dependencies
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/devenv

      - uses: ./.github/actions/mix-cache

      - name: Fetch the dependencies
        run: devenv shell -- bash -c 'cd platform && mix deps.get'

      - name: Check the format
        if: ${{ !cancelled() }}
        run: devenv shell -- bash -c 'cd platform && mix format --check-formatted'

      # Plain `mix credo`, not --strict (issue 30). It starts when
      # platform/.credo.exs is there.
      - name: Check the code with Credo
        if: ${{ !cancelled() && hashFiles('platform/.credo.exs') != '' }}
        run: devenv shell -- bash -c 'cd platform && mix credo'

      - name: Check the dependencies for advisories and retirements
        if: ${{ !cancelled() }}
        run: devenv shell -- bash -c 'cd platform && mix hex.audit'

      - name: Check that each locked dependency is used
        if: ${{ !cancelled() }}
        run: devenv shell -- bash -c 'cd platform && mix deps.unlock --check-unused'

      - name: Check that the migrations hold what the resources need
        if: ${{ !cancelled() }}
        run: devenv shell -- bash -c 'cd platform && mix ash.codegen --check'

  # The tests with no browser, in parts that run side by side (ADR 0103).
  # `mix test --partitions` gives each part a share of the test files. Each
  # job runs 4 parts at once on its runner, each part with a database and a
  # port of its own (scripts/test-in-parts.sh): most tests run one at a
  # time, so one `mix test` keeps about one core of the four busy. The
  # number of jobs is in two places here: the matrix and the second number
  # of the script.
  unit:
    name: Tests (job ${{ matrix.job }} of 8)
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/devenv

      - uses: ./.github/actions/mix-cache

      - name: Start PostgreSQL
        timeout-minutes: 5
        run: |
          devenv processes up -d
          devenv shell -- bash -c 'until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done'

      - name: Fetch the dependencies
        run: devenv shell -- bash -c 'cd platform && mix deps.get'

      - name: Test
        run: >-
          devenv shell -- bash -c 'scripts/test-in-parts.sh
          ${{ matrix.job }} 8 4 --exclude playwright'

  # The browser tests (tagged :playwright, ADR 0023), apart from the others,
  # in parts of their own. They drive Chromium, and the test helper stops
  # when CI has no driver of Playwright. `--only` finds a browser test in any
  # file. A part with no browser test fails ("no test was executed"), so
  # there are never more parts than files of browser tests. The file of
  # AccessibilityTest takes half of their time, so a third part would end no
  # sooner than two.
  browser:
    name: Browser tests (part ${{ matrix.partition }} of 2)
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      CI: "true"
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/devenv

      - uses: ./.github/actions/mix-cache

      - name: Start PostgreSQL
        timeout-minutes: 5
        run: |
          devenv processes up -d
          devenv shell -- bash -c 'until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done'

      - name: Fetch the dependencies
        run: devenv shell -- bash -c 'cd platform && mix deps.get'

      - name: Test
        run: >-
          devenv shell -- bash -c 'cd platform &&
          mix test --only playwright --partitions 2'

  # The Nix package, and the NixOS test that starts a release with
  # PostgreSQL, migrates, and runs each command of the server (ADR 0044).
  nix:
    name: Nix
    uses: ./.github/workflows/nix.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # One result for the whole run, for a rule of the branch: it fails when a
  # job failed or was cancelled, as by its timeout. The messages of the
  # commits are skipped in a run with no push, which is no failure. It does
  # not run in a run that a newer push cancelled, so that run ends as
  # cancelled, which `ci-catch-up.yml` counts as no result (ADR 0078).
  result:
    name: CI
    if: ${{ !cancelled() }}
    needs: [messages, notes, scan, scripts, compile, checks, unit, browser, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Each job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "The jobs ended as: $RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::A job of CI failed or was cancelled."
            exit 1
          fi

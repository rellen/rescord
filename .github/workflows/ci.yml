# The checks of each push to main and of each pull request (ADR 0047). They
# run inside the devenv shell, so CI has the toolchain of devenv.lock, its
# PostgreSQL 18, and the Playwright of nixpkgs for the browser tests. A push
# also checks the messages of its commits (ADR 0060), and each run scans the
# history for secrets (ADR 0064) and checks that each new migration has its
# upgrade note (ADR 0073). A release runs these checks too, before it
# publishes anything. A push to main cancels the run of the push before it,
# so `ci-catch-up.yml` starts a run that no push cancels when main has
# waited an hour for a result (ADR 0078).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of a branch or of a pull request cancels the older one. In a
# release, `github.workflow` is the name of the workflow Release, so a push
# to main and a release do not cancel each other.
#
# A run that the Actions page, the API or `ci-catch-up.yml` starts on main
# (workflow_dispatch) is kept (ADR 0078): it has a group of its own, so no
# push cancels it, and a second kept run waits for the first to end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '-kept' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  # A job of its own, so a bad message does not hide the result of the tests.
  messages:
    name: The messages of the commits
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history, for the commits of the push and the tag where the
      # rule starts.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check each commit of the push
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/check-commit-message.sh --range "$BEFORE..$GITHUB_SHA"

  # Each migration that is new since the last release has its line in the
  # upgrade notes of CHANGELOG.md, and no migration of that release changed
  # (ADR 0073). A job of its own, so a missing note shows beside the tests.
  notes:
    name: The upgrade notes of the migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The whole history and the tags: the check compares with the last
      # release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show that the check finds a migration with no note
        run: scripts/check-upgrade-notes.sh --self-test
      - name: Check each new migration
        run: scripts/check-upgrade-notes.sh

  # The scan for secrets, and for what belongs to one deployment (ADR 0064).
  # A job of its own, so a finding shows in a minute, beside the tests.
  # Gitleaks is the one of the nixpkgs of flake.lock.
  scan:
    name: The scan for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history: the scan reads each commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v32

      - name: Show that each rule finds its sample
        run: nix shell --inputs-from . nixpkgs#gitleaks -c scripts/check-secrets.sh --self-test

      # The secret PRIVATE_TERMS of the repository holds the names of the
      # deployments of the maintainer, one on each line. A pull request from
      # a fork has no secret, and the scan then runs with the rules alone.
      - name: Scan each commit
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -n "$PRIVATE_TERMS" ]; then
            printf '%s\n' "$PRIVATE_TERMS" > "$RUNNER_TEMP/private-terms"
            export RESCORD_PRIVATE_TERMS="$RUNNER_TEMP/private-terms"
          fi
          nix shell --inputs-from . nixpkgs#gitleaks -c scripts/check-secrets.sh

  test:
    name: Format, compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Restore the dependencies and the build
        uses: actions/cache@v6
        with:
          path: |
            platform/deps
            platform/_build
          key: mix-${{ hashFiles('devenv.lock', 'platform/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ hashFiles('devenv.lock', 'platform/mix.lock') }}-

      - name: Build the devenv shell
        run: devenv shell -- elixir --version

      - name: Start PostgreSQL
        timeout-minutes: 5
        run: |
          devenv processes up -d
          devenv shell -- bash -c 'until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done'

      - name: Fetch the dependencies
        run: devenv shell -- bash -c 'cd platform && mix deps.get'

      - name: Check the format
        run: devenv shell -- bash -c 'cd platform && mix format --check-formatted'

      - name: Check the dependencies for advisories and retirements
        run: devenv shell -- bash -c 'cd platform && mix hex.audit'

      - name: Check that each locked dependency is used
        run: devenv shell -- bash -c 'cd platform && mix deps.unlock --check-unused'

      - name: Compile with the test support, with no warning
        run: devenv shell -- bash -c 'cd platform && MIX_ENV=test mix compile --warnings-as-errors'

      # Nearly each test makes an organisation, so the tests run one by one:
      # 16 minutes at 06:36 UTC on 28 November 2026, and 24 minutes half an
      # hour and nine commits later. The limit leaves room until the tests run in
      # parts (`mix test --partitions`).
      - name: Test
        timeout-minutes: 60
        run: devenv shell -- bash -c 'cd platform && mix test'

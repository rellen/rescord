# A release (ADR 0047) of the version of platform/mix.exs, for a tag such as
# v0.1.0 that names it, or from the Actions page on main, which then makes
# the tag. It publishes:
#
#   * the image, for amd64 and arm64, at ghcr.io/<owner>/rescord with the
#     tags of the version and `latest`;
#   * a tarball of the release for each architecture, with SHA256SUMS, on a
#     GitHub release whose notes are the section of CHANGELOG.md.
#
# The flake is checked first, and the image of the last release is upgraded
# to the new version with its data (ADR 0051). Each architecture builds on a
# runner of its own: arm64 on ubuntu-24.04-arm, which GitHub gives a public
# repository.
#
# A dry run from the Actions page builds the image and the tarball for both
# architectures, writes the notes, and publishes nothing. It
# checks the workflow after a change, such as a new version of an action.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check each part, with no push of the image, no tag and no release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: The version and its tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(sed -nE 's/^ +version: "([^"]+)",$/\1/p' platform/mix.exs | head -1)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version $version of platform/mix.exs."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release from the Actions page runs on main."
              exit 1
            fi
            if [ "$DRY_RUN" != true ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::error::The tag $tag exists: change the version in platform/mix.exs."
              exit 1
            fi
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  nix:
    name: Nix
    needs: version
    uses: ./.github/workflows/nix.yml

  # The new version takes over the data of the last release, or nothing is
  # published (ADR 0051).
  upgrade:
    name: Upgrade from the last release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the new image
        uses: docker/build-push-action@v7
        with:
          context: platform
          platforms: linux/amd64
          load: true
          tags: rescord:new
          cache-from: type=gha,scope=image-amd64
      - name: Take the image of the last release
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY}:latest"
      - name: Upgrade, and check the data
        run: scripts/upgrade-test.sh "ghcr.io/${GITHUB_REPOSITORY}:latest" rescord:new

  # Each architecture builds on a runner of its own, and is pushed by its
  # digest; the job manifest joins the two under the tags of the version.
  image:
    name: Image (${{ matrix.arch }})
    needs: [version, upgrade]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: platform
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Keep the digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    name: Image
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - if: ${{ !inputs.dry_run }}
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags come from the version, because a run from the Actions page
      # has no tag yet.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=latest
      - name: Join the two architectures under the tags
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags=$(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON" | sed 's/^/--tag /')
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"

  tarball:
    name: Tarball (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the tarball
        run: scripts/release-tarball.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/rescord-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, nix, manifest, tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: Write the checksums and the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          (cd dist && sha256sum rescord-linux-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          awk -v heading="## $VERSION " '
            /^## / { inside = (index($0, heading) == 1); next }
            inside
          ' CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "The image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`."
            echo "[docs/self-hosting.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting.md) says how to install it."
          } >> notes.md
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        # From the Actions page, the release makes the tag at the commit that
        # was built.
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Rescord $VERSION" --notes-file notes.md

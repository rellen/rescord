# A release (ADR 0047) of the version of platform/mix.exs, for a tag such as
# v0.1.0 that names it, or from the Actions page on main, which then makes
# the tag. It publishes:
#
#   * the image, for amd64 and arm64, at ghcr.io/<owner>/rescord with the
#     tags of the version and `latest`;
#   * a tarball of the release for each architecture, with SHA256SUMS, on a
#     GitHub release whose notes are the section of CHANGELOG.md.
#
# The flake is checked first, and the image of the last release is upgraded
# to the new version with its data (ADR 0051). The arm64 builds run under
# QEMU on a runner of amd64, which each plan of GitHub has: slower, and
# nothing waits for a runner that the account does not have.
#
# A dry run from the Actions page builds the image for both architectures
# and the tarball of amd64, writes the notes, and publishes nothing. It
# checks the workflow after a change, such as a new version of an action.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check each part, with no push of the image, no tag and no release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: The version and its tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(sed -nE 's/^ +version: "([^"]+)",$/\1/p' platform/mix.exs | head -1)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the version $version of platform/mix.exs."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release from the Actions page runs on main."
              exit 1
            fi
            if [ "$DRY_RUN" != true ] && [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::error::The tag $tag exists: change the version in platform/mix.exs."
              exit 1
            fi
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  nix:
    name: Nix
    needs: version
    uses: ./.github/workflows/nix.yml

  # The new version takes over the data of the last release, or nothing is
  # published (ADR 0051).
  upgrade:
    name: Upgrade from the last release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the new image
        uses: docker/build-push-action@v7
        with:
          context: platform
          platforms: linux/amd64
          load: true
          tags: rescord:new
          cache-from: type=gha,scope=image
      - name: Take the image of the last release
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY}:latest"
      - name: Upgrade, and check the data
        run: scripts/upgrade-test.sh "ghcr.io/${GITHUB_REPOSITORY}:latest" rescord:new

  image:
    name: Image
    needs: [version, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags come from the version, because a run from the Actions page
      # has no tag yet.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: platform
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  tarball:
    name: Tarball (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.dry_run && '["amd64"]' || '["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the tarball
        run: scripts/release-tarball.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/rescord-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, nix, image, tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: Write the checksums and the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          (cd dist && sha256sum rescord-linux-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          awk -v heading="## $VERSION " '
            /^## / { inside = (index($0, heading) == 1); next }
            inside
          ' CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "The image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`."
            echo "[docs/self-hosting.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/self-hosting.md) says how to install it."
          } >> notes.md
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        # From the Actions page, the release makes the tag at the commit that
        # was built.
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "Rescord $VERSION" --notes-file notes.md

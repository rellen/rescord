# `nix flake check` (ADR 0044, ADR 0047): the Nix package, and a NixOS test of
# the module that starts Rescord with PostgreSQL, migrates, and runs each
# command of the server. CI calls it in each run (ADR 0103), and so does each
# release through CI. A pull request of Dependabot that changes
# platform/mix.lock fails here until the hash in nix/package.nix follows.
#
# The toolchain of the package is newer than the binary cache of nixpkgs has
# (ADR 0053): with no cache of its own, each run built Erlang, Elixir and
# rebar3, 13 of its 18 minutes. The Magic Nix Cache keeps each path that a
# run builds in the cache of GitHub Actions, and the next run takes it from
# there.
name: Nix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The NixOS test runs a virtual machine, which is slow without KVM.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          # Nothing is sent to a service of Determinate Systems.
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true

      - name: Check the flake
        run: nix flake check -L

# `nix flake check` (ADR 0044, ADR 0047): the Nix package, and a NixOS test of
# the module that starts Rescord with PostgreSQL, migrates, and runs each
# command of the server. CI calls it in each run (ADR 0103), and so does each
# release through CI. A pull request of Dependabot that changes
# platform/mix.lock fails here until the hash in nix/package.nix follows.
#
# The toolchain of the package is newer than the binary cache of nixpkgs has
# (ADR 0053): with no cache of its own, each run built Erlang, Elixir and
# rebar3, 13 of its 18 minutes. The public Cachix cache `rescord` keeps what
# a run on main builds, and each run takes it from there (ADR 0103). A run
# of a pull request or of another branch only reads the cache. The Magic Nix
# Cache, which keeps each path in the cache of GitHub Actions, hit the rate
# limit of that cache and starved the cache of mix of the other jobs.
name: Nix

on:
  workflow_call:
    secrets:
      # A token of the cache `rescord` that may write. With none, as in a
      # pull request from a fork, the job only reads the cache.
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The NixOS test runs a virtual machine, which is slow without KVM.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Only a push to main and a run from the Actions page on main write to
      # the cache. In a workflow that CI calls, the ref and the event are
      # those of CI. The filter keeps out the sources and the run of the
      # NixOS test, so the test runs again in each run. The package of
      # Rescord and the system of the test machine are kept all the same:
      # they are in the closure of the units of that machine. A commit that
      # changes no file of the package (only tests, say) then needs no
      # build at all.
      - uses: cachix/cachix-action@v17
        with:
          name: rescord
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' || !contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) }}
          pushFilter: "(-source$|vm-test-run-|nixos-test-driver)"

      - name: Check the flake
        run: nix flake check -L
